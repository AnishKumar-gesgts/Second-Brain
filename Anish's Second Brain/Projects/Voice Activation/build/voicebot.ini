# Restart VoiceBot.exe after changing this file.
# CamelCase phrases are also recognized with natural spacing (VoiceBot -> voice bot).
Trigger=voice bot

# Range: 0.0 to 1.0. Raise this if you get false activations.
Confidence=0.80

# Asterisk, Beep, Exclamation, Hand, or Question.
Sound=Asterisk

# Played once Codex accepts the transcribed command.
CommandSubmittedSound=Beep

# Played when Codex returns a normal completed response.
ResponseCompleteSound=Exclamation

# Played when the response appears to ask a question or request clarification.
ClarificationSound=Question

# After the wake ping, start speaking within this many seconds.
DictationStartTimeoutSeconds=8

# The sentence is submitted after this much silence.
EndSilenceSeconds=1.2

# Hard limit for a single voice command.
DictationMaximumSeconds=30

# Relative to build\VoiceBot.exe. Codex receives workspace-write access only here.
Workspace=..

# "auto" searches PATH and the installed VS Code Codex extension.
CodexPath=auto

# Voice commands are explicitly pinned so global Codex model changes do not affect them.
CodexModel=gpt-5.6-luna
CodexReasoningEffort=low

# Read short Codex responses aloud with the built-in Windows voice.
SpeakResponses=true

# Selects an installed voice by partial name. Guy will be used once its Natural Voice package is installed.
TtsVoice=Guy

# Longer responses are truncated for speech but remain in the response file.
SpeechMaximumCharacters=500

# Completed responses remain in the top-right overlay for this many seconds.
OverlaySeconds=15
